name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Exact version (e.g. 1.2.0) — overrides bump'
        type: string
        required: false

permissions:
  contents: write # push version commit + tag, create release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=$(npm version "${{ inputs.version != '' && inputs.version || inputs.bump }}" -m "Release v%s")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # prepublishOnly runs typecheck + tests + build; auth via OIDC, no token.
      # Publish before pushing so a failed publish leaves the repo untouched.
      - run: npm publish

      - run: git push --follow-tags

      - name: Create GitHub release
        run: gh release create "${{ steps.bump.outputs.tag }}" --title "${{ steps.bump.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
