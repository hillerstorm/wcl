name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Exact version (e.g. 1.2.0) — overrides bump'
        type: string
        required: false

permissions:
  contents: write # push version commit + tag, create release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, for the release-notes commit list

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1 (bundled with current node 24)
      - run: npm ci

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "prev=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" = "$CURRENT" ]; then
            # The bump already landed as a commit (e.g. "Release vX.Y.Z" made by hand): tag it, don't re-bump.
            TAG="v$CURRENT"
            git tag -a "$TAG" -m "Release $CURRENT"
          else
            TAG=$(npm version "${{ inputs.version != '' && inputs.version || inputs.bump }}" -m "Release v%s")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # prepublishOnly runs typecheck + tests + build; auth via OIDC, no token.
      # Publish before pushing so a failed publish leaves the repo untouched.
      - run: npm publish

      - run: git push --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.bump.outputs.prev }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          {
            # $TAG^ excludes the "Release vX.Y.Z" commit itself
            git log --oneline --reverse "$PREV..$TAG^" | sed 's/^/* /'
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
